name: Build APK  
on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  

    steps:  
      - uses: actions/checkout@v4  

      # 1. Встановлюємо Java 17 (замість Java 8)
      - name: Set up Java 17  
        uses: actions/setup-java@v4  
        with:  
          java-version: '17'  
          distribution: 'temurin'  

      # 2. Ліцензії Android  
      - name: Accept Android licenses  
        run: |  
          mkdir -p ~/.android/licenses  
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license  
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license  

      # 3. Встановлюємо Android SDK з новими CLI Tools
      - name: Install Android SDK  
        uses: android-actions/setup-android@v2  
        with:  
          build-tools: 34.0.0  
          ndk-version: 26.2.11394342  
          platforms: android-34  
          cmdline-tools: "latest"  
          extra-packages: |  
            platform-tools  
            tools  

      # 4. Python 3.11
      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.11'  

      # 5. Встановлюємо Cython та Buildozer  
      - name: Install Python dependencies  
        run: |  
          pip install cython==0.29.36  
          pip install buildozer  

      # 6. Збірка APK  
      - name: Build APK  
        run: buildozer -v android debug  

      # 7. Завантаження APK  
      - name: Upload APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: ukr-chatbot  
          path: bin/*.apk  
- name: Debug environment  
  run: env  
