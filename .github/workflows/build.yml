name: Build APK  
on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  

    steps:  
      - uses: actions/checkout@v4  

      # 1. Python 3.11
      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.11'  

      # 2. Примусово встановлюємо Java 8
      - name: Force Java 8 environment  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y openjdk-8-jdk  
          sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java  
          sudo update-alternatives --set javac /usr/lib/jvm/java-8-openjdk-amd64/bin/javac  
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV  

      # 3. Ліцензії Android  
      - name: Accept Android licenses  
        run: |  
          mkdir -p ~/.android/licenses  
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license  
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license  

      # 4. SDK з альтернативним шляхом
      - name: Install Android SDK  
        uses: android-actions/setup-android@v2  
        with:  
          sdk-root: ${{ github.workspace }}/custom-android-sdk  
          build-tools: 34.0.0  
          ndk-version: 26.2.11394342  
          platforms: android-34  
          cmdline-tools: "latest"  
          extra-packages: |  
            platform-tools  
            tools  

      # 5. Оновлюємо змінні середовища
      - name: Configure Android paths  
        run: |  
          echo "ANDROID_HOME=${{ github.workspace }}/custom-android-sdk" >> $GITHUB_ENV  
          echo "ANDROID_SDK_ROOT=${{ github.workspace }}/custom-android-sdk" >> $GITHUB_ENV  
          echo "PATH=${{ github.workspace }}/custom-android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV  

      # 6. Встановлюємо Cython та Buildozer  
      - name: Install Python dependencies  
        run: |  
          pip install cython==0.29.36  
          pip install buildozer  

      # 7. Збірка з детальним логуванням  
      - name: Build APK  
        run: |  
          buildozer -v android debug 2>&1 | tee build.log  
          ls -lR ${{ github.workspace }}/custom-android-sdk  # Діагностика SDK  

      # 8. Завантаження артефактів  
      - name: Upload artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: debug-data  
          path: |  
            bin/  
            .buildozer/  
            build.log  
