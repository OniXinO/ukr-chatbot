name: Build APK  
on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  

    steps:  
      - uses: actions/checkout@v4  

      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.11'  

      - name: Install system dependencies  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y git zip unzip openjdk-8-jdk python3-pip autoconf libtool pkg-config zlib1g-dev

      - name: Force Java 8  
        run: |  
          sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java  
          sudo update-alternatives --set javac /usr/lib/jvm/java-8-openjdk-amd64/bin/javac  

      - name: Accept Android licenses  
        run: |  
          mkdir -p ~/.android/licenses  
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license  
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license  

      - name: Install Android SDK  
        uses: android-actions/setup-android@v2  
        with:  
          sdk-root: ${{ github.workspace }}/android-sdk  
          build-tools: 34.0.0  
          ndk-version: 26.2.11394342  
          platforms: android-34  
          cmdline-tools: latest  
          extra-packages: |  
            platform-tools  
            tools  

      - name: Set Android environment  
        run: |  
          echo "ANDROID_HOME=${{ github.workspace }}/android-sdk" >> $GITHUB_ENV  
          echo "ANDROID_SDK_ROOT=${{ github.workspace }}/android-sdk" >> $GITHUB_ENV  
          echo "PATH=${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV  

      - name: Install Python dependencies  
        run: |  
          pip install cython==0.29.36  
          pip install buildozer  

      - name: Build APK  
        run: |  
          buildozer -v android clean
          buildozer -v android debug 2>&1 | tee build.log  

      - name: Check APK existence  
        run: |  
          ls -la bin/
          if ! ls bin/*.apk 1> /dev/null 2>&1; then
            echo "::error::APK file not found!"
            exit 1
          fi

      - name: Display build log  
        run: cat build.log  

      - name: Upload artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: build-artifacts  
          path: |  
            bin/*.apk  
            build.log  
          if-no-files-found: error
