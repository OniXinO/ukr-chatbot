jobs:  
  build:  
    steps:  
      - uses: actions/checkout@v4  
      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.11'  
      - name: Install Cython and Buildozer  
        run: |  
          pip install cython==0.29.36  
          pip install buildozer  
      - name: Build APK  
        run: buildozer android debug   
      - name: Install Java 8  
        run: sudo apt-get install -y openjdk-8-jdk  
      - name: Set Java 8 as default  
        run: sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java  
      - name: Accept Android licenses  
        run: |  
          mkdir -p $HOME/.android/licenses  # Спочатку створюємо папку licenses  
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.android/licenses/android-sdk-license  
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.android/licenses/android-sdk-license  
      - name: Install Android SDK  
        uses: android-actions/setup-android@v2  
        with:  
          build-tools: 34.0.0  
          ndk-version: 26.2.11394342  
      - name: Build APK  
        run: |  
          pip install buildozer  
          buildozer android debug  
      - name: Upload APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: chatbot-apk  
          path: bin/*.apk  
