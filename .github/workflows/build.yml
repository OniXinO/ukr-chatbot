name: Build APK  
on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  

    steps:  
      - uses: actions/checkout@v4  

      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.9'

      - name: Debug Environment
        run: |
          java -version
          javac -version
          echo "JAVA_HOME: $JAVA_HOME"
          python --version
          pip --version

      - name: Install system dependencies  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y \
            git zip unzip openjdk-11-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            build-essential libffi-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpango1.0-dev

      - name: Setup Android SDK  
        uses: android-actions/setup-android@v2  
        with:  
          sdk-root: /usr/local/lib/android/sdk  
          build-tools: 29.0.3
          ndk-version: 23.1.7779620
          platforms: android-29
          cmdline-tools: 8.0  
          extra-packages: |  
            platform-tools  
            tools  

      - name: Show Android SDK/NDK details
        run: |
          echo "Android SDK location:"
          ls -la $ANDROID_HOME
          echo "Android NDK location:"
          ls -la $ANDROID_HOME/ndk

      - name: Configure environment  
        run: |  
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV  
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/23.1.7779620" >> $GITHUB_ENV  
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV  

      - name: Install Python packages
        run: |  
          python -m pip install --upgrade pip wheel setuptools
          pip install cython==0.29.33
          # Only install needed dependencies
          pip install kivy==2.1.0
          pip install buildozer==1.5.0
          
          # Test Kivy Import
          python -c "import kivy; print('Kivy version:', kivy.__version__)"
          
          # Show installed packages
          pip list

      - name: Create minimal buildozer.spec
        run: |
          cat > buildozer.spec << EOF
          [app]
          title = Minimal App
          package.name = minimal
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          source.include_patterns = assets/*
          source.exclude_dirs = tests, bin, .git
          source.exclude_patterns = buildozer.spec
          # Use the simplest file
          source.main.file = minimal.py
          version = 1.0
          
          # Simple requirements
          requirements = python3,kivy==2.1.0
          
          # Explicitly set NDK/SDK versions
          android.api = 29
          android.minapi = 21
          android.ndk = 23.1.7779620
          android.sdk = 29
          android.sdk_path = /usr/local/lib/android/sdk
          android.ndk_path = /usr/local/lib/android/sdk/ndk/23.1.7779620
          
          # Use default bootstrap (sdl2)
          android.bootstrap = sdl2
          android.permissions = INTERNET
          android.arch = armeabi-v7a
          
          # Basic graphics configuration
          orientation = portrait
          fullscreen = 0
          android.accept_sdk_license = True
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          
          cat buildozer.spec

      - name: Verify all files
        run: |
          echo "Current directory:"
          ls -la
          echo "Checking minimal.py:"
          cat minimal.py
          echo "Checking buildozer.spec:"
          cat buildozer.spec

      - name: Clean environment
        run: |
          # Start from complete scratch
          rm -rf ./.buildozer || true
          rm -rf ./bin || true

      - name: Build APK with maximum verbosity
        run: |  
          echo "Starting build with maximum verbosity..."
          buildozer -v -v android debug 2>&1 | tee build.log

      - name: Check build log files
        if: always()
        run: |
          echo "=== BUILD LOG TAIL ==="
          if [ -f build.log ]; then
            tail -n 1000 build.log
          else
            echo "build.log not found"
          fi
          
          echo "=== CHECKING FOR GRADLE LOGS ==="
          find .buildozer -name "*.gradle" -o -name "gradle*" | xargs ls -la || echo "No gradle files found"
          
          echo "=== CHECKING FOR ADDITIONAL LOGS ==="
          find .buildozer -name "*.log" | xargs ls -la || echo "No log files found"

      - name: Check all locations for APK
        if: always()
        run: |
          echo "Checking for APK files anywhere in the repository..."
          find . -name "*.apk" | xargs ls -la || echo "No APK found anywhere"
          
          echo "Checking bin directory:"
          ls -la bin/ || echo "Bin directory doesn't exist"
          
          echo "Checking .buildozer app outputs:"
          find .buildozer -path "*/app/build/outputs" -type d | xargs ls -la || echo "No outputs directory found"

      - name: Upload all artifacts
        if: always()
        uses: actions/upload-artifact@v4  
        with:  
          name: build-artifacts  
          path: |  
            *.py
            buildozer.spec
            build.log
            .buildozer/**/*.log
            .buildozer/**/*.apk
            .buildozer/android/app/build/outputs/**
            bin/**
