name: Build APK  
on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  

    steps:  
      # Крок 1: Завантаження коду
      - uses: actions/checkout@v4  

      # Крок 2: Встановлення Python 3.11
      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.11'  

      # Крок 3: Системні залежності
      - name: Install system dependencies  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y git zip unzip openjdk-8-jdk  

      # Крок 4: Фіксація Java 8
      - name: Force Java 8  
        run: |  
          sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java  
          sudo update-alternatives --set javac /usr/lib/jvm/java-8-openjdk-amd64/bin/javac  

      # Крок 5: Ліцензії Android
      - name: Accept Android licenses  
        run: |  
          mkdir -p $HOME/.android/licenses  
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.android/licenses/android-sdk-license  
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.android/licenses/android-sdk-license  

      # Крок 6: Android SDK + NDK
      - name: Install Android SDK  
        uses: android-actions/setup-android@v2  
        with:  
          build-tools: 34.0.0  
          ndk-version: 26.2.11394342  
          platforms: android-34  
          cmdline-tools: latest  
          extra-packages: |  
            platform-tools  
            tools  

      # Крок 7: Налаштування шляхів
      - name: Configure paths  
        run: |  
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV  
          echo "PATH=$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV  

      # Крок 8: Python-залежності
      - name: Install Python dependencies  
        run: |  
          pip install cython==0.29.36  
          pip install buildozer  

      # Крок 9: Збірка APK
      - name: Build APK  
        run: |  
          buildozer -v android debug  
          ls -R  # Діагностика файлів  

      # Крок 10: Завантаження артефактів
      - name: Upload APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: ukr-chatbot  
          path: |  
            bin/*.apk  
            .buildozer  
