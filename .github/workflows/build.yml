name: Build APK  
on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  

    steps:  
      - uses: actions/checkout@v4  

      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.11'  

      - name: Install system dependencies  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y \
            git zip unzip openjdk-8-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev ncurses-dev \
            libssl-dev libffi-dev  

      - name: Install Python tools  
        run: |  
          python -m pip install --upgrade pip wheel  
          pip install virtualenv  

      - name: Create and activate virtual environment  
        run: |  
          virtualenv venv  
          echo "VIRTUAL_ENV=venv" >> $GITHUB_ENV  
          echo "PATH=$GITHUB_WORKSPACE/venv/bin:$PATH" >> $GITHUB_ENV  

      - name: Install Buildozer and dependencies  
        run: |  
          pip install --upgrade cython==0.29.36  
          pip install buildozer==1.5.0  
          buildozer --version  

      - name: Setup Android SDK  
        uses: android-actions/setup-android@v2  
        with:  
          sdk-root: ${{ github.workspace }}/android-sdk  
          build-tools: 34.0.0  
          ndk-version: 25.2.9519653  
          platforms: android-34  
          cmdline-tools: 9.0  
          extra-packages: |  
            platform-tools  
            tools  

      - name: Configure environment  
        run: |  
          echo "ANDROID_HOME=${{ github.workspace }}/android-sdk" >> $GITHUB_ENV  
          echo "ANDROID_SDK_ROOT=${{ github.workspace }}/android-sdk" >> $GITHUB_ENV  
          echo "PATH=${{ github.workspace }}/android-sdk/cmdline-tools/9.0/bin:$PATH" >> $GITHUB_ENV  
          
          # Оновлюємо buildozer.spec
          sed -i "s|android.sdk_path = .*|android.sdk_path = ${{ github.workspace }}/android-sdk|" buildozer.spec  
          sed -i "s|android.ndk_path = .*|android.ndk_path = ${{ github.workspace }}/android-sdk/ndk/25.2.9519653|" buildozer.spec  

      - name: Build APK  
        run: |  
          buildozer -v android clean  
          buildozer -v android update  
          buildozer -v android debug 2>&1 | tee build.log  

      - name: Verify artifacts  
        run: |  
          ls -la bin/  
          if [ ! -f bin/*.apk ]; then  
            echo "::error::APK file missing!"  
            exit 1  
          fi  

      - name: Upload artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: app-artifacts  
          path: |  
            bin/*.apk  
            build.log  
          if-no-files-found: error  
