name: Build APK  
on: [push]  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  
      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: "3.11" 
          - name: Install JAXB  
  run: pip install jaxb  
          - name: Install Java 8
  run: sudo apt-get install -y openjdk-8-jdk
- name: Install Android SDK
  uses: android-actions/setup-android@v2
  with:
    jdk-version: 8  # Це ключовий рядок
    build-tools: 34.0.0
    ndk-version: 26.2.11394342
      - name: Force SDK paths  
        run: |  
          mkdir -p $HOME/.buildozer/android/platform  
          ln -s $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk  
          ln -s $ANDROID_NDK $HOME/.buildozer/android/platform/android-ndk  
        env:  
          ANDROID_HOME: /usr/local/lib/android/sdk  
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/26.2.11394342  
      - name: Install dependencies  
        run: |  
          pip install buildozer cython==0.29.36  
      - name: Build APK  
        run: |  
          buildozer android debug  
      - name: Upload APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: ukr-chatbot  
          path: bin/*.apk  
