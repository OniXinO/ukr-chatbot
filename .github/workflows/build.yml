name: Build APK  
on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  

    steps:  
      - uses: actions/checkout@v4  

      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.11'  

      - name: Install system dependencies  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y \
            git zip unzip openjdk-8-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev ncurses-dev  

      - name: Setup Android SDK  
        uses: android-actions/setup-android@v2  
        with:  
          sdk-root: /usr/local/lib/android/sdk  
          build-tools: 34.0.0  
          ndk-version: 25.2.9519653  
          platforms: android-34  
          cmdline-tools: 9.0  
          extra-packages: |  
            platform-tools  
            tools  

      - name: Configure environment  
        run: |  
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV  
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV  
          echo "PATH=$ANDROID_HOME/cmdline-tools/9.0/bin:$PATH" >> $GITHUB_ENV  

      - name: Install Python tools  
        run: |  
          python -m pip install --upgrade pip wheel  
          python -m venv venv  
          source venv/bin/activate  
          pip install cython==0.29.36  
          pip install buildozer==1.5.0  

      # Let buildozer manage python-for-android directly instead of copying it
      - name: Build APK  
        run: |  
          source venv/bin/activate  
          buildozer -v android clean  
          buildozer -v android debug 2>&1 | tee build.log  

      - name: Verify build  
        run: |  
          if [ ! -f bin/*.apk ]; then  
            echo "::error::APK file not found!"  
            cat build.log  
            exit 1  
          fi  

      - name: Upload artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: app-artifacts  
          path: |  
            bin/*.apk  
            build.log  
