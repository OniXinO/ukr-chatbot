name: Build APK  
on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  

    steps:  
      - uses: actions/checkout@v4  

      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.11'  

      - name: Install system dependencies  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y \
            git zip unzip openjdk-8-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev ncurses-dev  

      - name: Setup Android SDK  
        uses: android-actions/setup-android@v2  
        with:  
          sdk-root: /usr/local/lib/android/sdk  
          build-tools: 34.0.0  
          ndk-version: 25.2.9519653  
          platforms: android-34  
          cmdline-tools: 9.0  

      - name: Configure environment  
        run: |  
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV  
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV  
          echo "PATH=$ANDROID_HOME/cmdline-tools/9.0/bin:$PATH" >> $GITHUB_ENV  

      - name: Install Python tools  
        run: |  
          python -m pip install --upgrade pip wheel  
          python -m venv venv  
          source venv/bin/activate  
          pip install cython==0.29.36  
          pip install buildozer==1.5.0  
          pip install python-for-android==2023.9.16  

      - name: Initialize Buildozer  
        run: |  
          source venv/bin/activate  
          rm -f buildozer.spec  
          buildozer init --force  
          sed -i "s|^p4a.branch = .*|p4a.branch = 2023.09.16|" buildozer.spec  
          sed -i "s|android.sdk_path = .*|android.sdk_path = /usr/local/lib/android/sdk|" buildozer.spec  
          sed -i "s|android.ndk_path = .*|android.ndk_path = /usr/local/lib/android/sdk/ndk/25.2.9519653|" buildozer.spec  

      - name: Prepare build environment  
        run: |  
          source venv/bin/activate  
          mkdir -p .buildozer/android/platform  
          ln -s $HOME/.local/lib/python3.11/site-packages/python_for_android .buildozer/android/platform/python-for-android  
          ls -la .buildozer/android/platform  

      - name: Build APK  
        run: |  
          source venv/bin/activate  
          buildozer -v android clean  
          buildozer -v android debug \
            --p4a-dir $HOME/.local/lib/python3.11/site-packages/python_for_android \
            --sdk-dir $ANDROID_HOME \
            --ndk-dir $ANDROID_NDK_HOME \
            2>&1 | tee build.log  

      - name: Upload artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: app-artifacts  
          path: |  
            bin/*.apk  
            build.log  
