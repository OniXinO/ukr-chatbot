name: Build APK  
on: [push]  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  
      - name: Set up Python  
        uses: actions/setup-python@v4  
        with:  
          python-version: '3.11'  
      - name: Install system deps  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y git zip openjdk-17-jdk unzip python3-venv  
          pip install cython==0.29.36  # Фіксована версія, щоб уникнути збоїв  
      - name: Install Buildozer  
        run: pip install buildozer  
      - name: Build APK  
        run: |  
          buildozer android debug  
      - name: Upload APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: chatbot-apk  
          path: bin/*.apk  
- name: Install Android SDK  
  run: |  
    echo "y" | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"  
