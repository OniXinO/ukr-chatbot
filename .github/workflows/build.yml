name: Build APK  
on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  

    steps:  
      - uses: actions/checkout@v4  

      # 1. Додаємо явну ініціалізацію Buildozer
      - name: Init Buildozer
        run: |
          buildozer init
          [ -f buildozer.spec ] || exit 1

      # 2. Оновлюємо системні залежності
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-8-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev ncurses-dev

      # 3. Використовуємо стабільну версію Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          sdk-root: /usr/local/lib/android/sdk
          build-tools: 34.0.0
          ndk-version: 25.2.9519653  # Стабільна версія NDK
          platforms: android-34
          cmdline-tools: 9.0  # Конкретна версія

      # 4. Примусово оновлюємо Buildozer
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install --force-reinstall cython==0.29.36
          pip install --force-reinstall buildozer==1.5.0  # Стабільна версія

      # 5. Додаємо крок для ручного створення директорій
      - name: Create required directories
        run: |
          mkdir -p ~/.buildozer/android/platform
          mkdir -p ~/.gradle/caches

      # 6. Оновлений крок збірки з додатковими прапорцями
      - name: Build APK
        run: |
          buildozer -v android clean
          buildozer -v android update  # Новий крок для оновлення залежностей
          buildozer -v android debug \
            -- \
            --package-name org.ukr.chatbot \
            --sdk-dir /usr/local/lib/android/sdk \
            --ndk-dir /usr/local/lib/android/sdk/ndk/25.2.9519653 \
            2>&1 | tee build.log

      # Інші кроки залишаються без змін...
